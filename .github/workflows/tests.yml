# Runs the quick test suite on every push and pull request. It needs no AWS: the tests use
# the local filesystem only. The integration tests (whole pipeline days) are skipped to keep this fast;
# run them locally with `python -m pytest` in the Docker image (see README).
name: tests

on:
  push:
  pull_request:

# Read-only token: this workflow only checks code out and runs tests.
permissions:
  contents: read

# A newer push to the same branch cancels the run that's still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-tests:
    name: pytest -m "not integration"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved, a SHA can't). The comment is the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Spark runs on the JVM. Same Java as the Docker image: Temurin 17.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Same packages as docker/Dockerfile. Airflow is only needed for the DAG test. Its constraints
      # file pins Airflow's own dependencies to the versions it was released with (boto3 1.43.75
      # among them, matching requirements.txt), and doesn't pin pyspark, delta-spark or pytest.
      - name: Install dependencies
        run: >-
          pip install "apache-airflow==3.3.2" -r requirements-dev.txt
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.11.txt"

      # Outside the Docker image SPARK_EXTRA_JARS is unset, so Spark downloads the Delta and
      # hadoop-aws jars from Maven Central on first start (see src/lakehouse_common/spark.py).
      - name: Run quick tests
        run: python -m pytest -m "not integration"
